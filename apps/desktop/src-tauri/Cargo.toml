[package]
name = "acta-desktop"
description = "App Tauri v2: composición, comandos/eventos, pastilla NSPanel, bandeja y detección → pregunta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "acta_desktop_lib"
crate-type = ["rlib"]

[features]
default = []
# Embeddings locales (fastembed + onnxruntime). Lo activa scripts/install-mac.sh.
# Sin la feature la búsqueda es solo FTS5 (nunca se mezclan vectores de otro modelo).
local-embeddings = ["acta-store/local-embeddings"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
acta-core = { workspace = true }
acta-audio = { workspace = true }
acta-store = { workspace = true }
acta-llm = { workspace = true }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-opener = { workspace = true }
auto-launch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }

# Solo macOS: adaptadores nativos y la pastilla como NSPanel.
[target.'cfg(target_os = "macos")'.dependencies]
acta-mac-bridge = { workspace = true }
tauri-nspanel = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Lints propios (no workspace): las macros de Tauri/nspanel generan código con unsafe.
[lints.clippy]
zombie_processes = "deny"
let_underscore_future = "deny"
unwrap_used = "warn"
expect_used = "warn"
